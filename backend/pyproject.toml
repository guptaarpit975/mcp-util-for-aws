[project]
name = "opslens-api"
version = "0.1.0"
description = "Local FastAPI backend for OpsLens"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "anthropic>=0.75,<2",
  "asyncmy>=0.2.10,<1",
  "aws-ops-mcp",
  "fastapi>=0.115,<1",
  "keyring>=25,<26",
  "mcp>=2,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "structlog>=24,<26",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opslens"]
