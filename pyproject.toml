[project]
name = "opslens-workspace"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["backend", "mcp-server"]

[tool.uv.sources]
aws-ops-mcp = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"backend/src/opslens/api/routes/*.py" = ["B008"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["backend/tests", "mcp-server/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
